<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>TodoList</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="TodoList">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --page: #ffffff;   /* 화면 바탕 */
    --soft: #f6f5f3;
    --text: #2f2f33;
    --sub: #7a7a80;
    --muted: #b3b3b8;
    --line: #f0efed;
    --sun: #e28b8b;
    --sat: #7e9dd6;
    --good: #9ccb8b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--page); color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
  button:active { opacity: .6; }
  svg { display: block; }
  .app {
    max-width: 480px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 20px calc(104px + env(safe-area-inset-bottom)); /* 아래 + 버튼 자리 */
  }
  .fade { animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- 상단 ---------- */
  .bar { display: flex; align-items: center; justify-content: space-between; height: 44px; }
  .brand { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; }
  .actions { display: flex; align-items: center; gap: 4px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--text);
  }
  .pill {
    height: 32px; padding: 0 14px; border-radius: 999px; background: var(--soft);
    font-size: 13px; font-weight: 600; color: var(--sub);
  }
  .date-head { margin: 10px 0 14px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); }
  .date-head h1 { margin: 2px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.6px; }

  /* ---------- 주 달력 ---------- */
  .week { display: flex; align-items: center; margin: 0 -10px; touch-action: pan-y; }
  .week .icon-btn { width: 32px; color: var(--muted); flex: none; }
  .week-days { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0; }
  .wd .w { font-size: 11px; font-weight: 600; color: var(--muted); }
  .wd.sun .w { color: var(--sun); }
  .wd.sat .w { color: var(--sat); }
  .wd .n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  .wd.today .n { background: var(--soft); }
  .wd.selected .n { background: var(--text); color: #fff; }
  .wd .st { width: 5px; height: 5px; border-radius: 50%; }
  .wd .st.left { background: #dcdad6; }
  .wd .st.all { background: var(--good); }

  .progress { display: flex; align-items: center; gap: 10px; margin: 18px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .track { flex: 1; height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--good); border-radius: 999px; transition: width .3s; }

  /* ---------- 카테고리 & 할 일 ---------- */
  /* 카테고리마다 흰 카드 */
  /* 카테고리 사이에 실선 */
  .cat { padding: 14px 0 8px; }
  .cat + .cat { border-top: 1px solid #e9e7e3; }
  .cat-head { display: flex; align-items: center; gap: 6px; }
  .cat-name {
    display: inline-flex; align-items: center; gap: 8px; height: 36px; padding-right: 6px;
    font-size: 15px; font-weight: 700;
  }
  .cat-name i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .cat-count { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: auto; }
  .more-btn {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted);
  }
  .add-btn {
    width: 26px; height: 26px; margin-left: 2px; border-radius: 50%; display: grid; place-items: center;
    color: var(--sub); background: color-mix(in srgb, var(--c) 28%, #fff);
  }

  /* 할 일 목록: 카테고리보다 한 칸 들여 쓰기 */
  .todos { list-style: none; margin: 0 4px 0 18px; padding: 0; }
  .todo { display: flex; align-items: flex-start; gap: 10px; }
  .box {
    flex: none; width: 44px; height: 44px; margin: 0 -11px 0 -11px; display: grid; place-items: center;
  }
  .box span {
    width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center;
    border: 1.8px solid color-mix(in srgb, var(--c) 80%, #555);
    transition: background .15s;
  }
  .done .box span, .box.on span { background: var(--c); border-color: var(--c); }
  .todo-main {
    flex: 1; min-width: 0; min-height: 44px; padding: 11px 0; text-align: left;
    border-bottom: 1px solid var(--line);
  }
  .todo:last-child .todo-main { border-bottom: none; }
  .todo-main .t { font-size: 15px; line-height: 1.45; word-break: break-word; }
  .done .todo-main .t { text-decoration: line-through; color: var(--muted); }
  .meta { display: flex; align-items: center; gap: 10px; margin-top: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
  .meta span { display: inline-flex; align-items: center; gap: 3px; min-width: 0; }
  .meta .memo-prev { overflow: hidden; }
  .meta .memo-prev em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty-cat { margin-left: 18px; padding: 2px 0 12px; font-size: 13px; color: var(--muted); }

  .empty-all { margin-top: 40px; text-align: center; font-size: 14px; color: var(--muted); }

  /* ---------- 카테고리 필터 ---------- */
  .filters { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; }
  .filter-scroll { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .fchip {
    flex: none; height: 34px; padding: 0 14px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--soft); color: var(--sub); font-size: 14px; font-weight: 600; white-space: nowrap;
  }
  .fchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .fchip.on { background: var(--text); color: #fff; }
  .fadd {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; color: var(--sub);
    border: 1.5px dashed #d4d2ce;
  }

  /* ---------- 월 달력 ---------- */
  .month-bar { display: flex; align-items: center; height: 44px; margin: 0 -12px; }
  .month-bar h1 { margin: 0 auto 0 0; font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
  .dow, .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .month-card { margin-top: 14px; }
  .dow div { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding-bottom: 6px; }
  .dow .sun, .cell.sun .num { color: var(--sun); }
  .dow .sat, .cell.sat .num { color: var(--sat); }
  .grid { touch-action: pan-y; }
  .cell { min-height: 64px; padding: 4px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell .num { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 600; }
  .cell.other { opacity: .3; }
  .cell.today .num { background: var(--soft); }
  .cell.selected .num { background: var(--text); color: #fff !important; }
  .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 40px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--c) 80%, #555); }
  .dot.on { background: var(--c); border-color: var(--c); }
  .more { font-size: 9px; line-height: 6px; color: var(--muted); }
  .month-sum { margin-top: 12px; padding: 14px 16px; border-radius: 14px; background: var(--soft); font-size: 14px; color: var(--sub); }
  .month-sum b { color: var(--text); }

  /* ---------- 팝업 (화면 가운데) ---------- */
  .overlay {
    position: fixed; left: 0; right: 0; top: 0; height: 100%; z-index: 10; background: rgba(30, 30, 34, .32);
    display: none; align-items: center; justify-content: center;
    padding: 16px calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left));
  }
  .overlay.show { display: flex; animation: dim .18s ease; }
  @keyframes dim { from { opacity: 0; } }
  .sheet {
    width: 100%; max-width: 420px; max-height: 100%; background: #fff;
    display: flex; flex-direction: column; overflow: hidden;
    border-radius: 22px; padding: 22px 0 18px;
    box-shadow: 0 12px 40px rgba(30, 30, 34, .18);
    animation: pop .2s cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } }
  .grab { display: none; }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; font-weight: 800; }
  .sheet input[type=text], .sheet textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--text);
    padding: 13px 14px; border-radius: 12px; border: 1.5px solid transparent; background: var(--soft); outline: none;
  }
  .sheet input[type=text]:focus, .sheet textarea:focus { border-color: #dcdad6; background: #fff; }
  .sheet textarea { resize: none; min-height: 76px; line-height: 1.55; }
  .label { margin: 18px 0 8px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    height: 36px; padding: 0 14px; border-radius: 999px; background: var(--soft);
    font-size: 14px; font-weight: 600; color: var(--sub); display: inline-flex; align-items: center; gap: 7px;
  }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .chip.on { background: var(--text); color: #fff; }
  .days { display: flex; justify-content: space-between; margin-top: 10px; }
  .daybtn { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); font-size: 14px; font-weight: 600; }
  .daybtn.sun { color: var(--sun); }
  .daybtn.sat { color: var(--sat); }
  .daybtn.on { background: var(--text); color: #fff; }
  /* 날짜 고르기 칩: 투명한 날짜 입력칸을 칩 위에 덮어서 누르면 달력이 열림 */
  .date-chip { position: relative; cursor: pointer; }
  .date-chip input {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
    font-size: 16px; border: 0; padding: 0;
  }
  .hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; }
  .swatch { width: 36px; height: 36px; border-radius: 50%; background: var(--c); display: grid; place-items: center; }
  .swatch.on { box-shadow: 0 0 0 3px #fff, 0 0 0 5px color-mix(in srgb, var(--c) 80%, #555); }
  html.lock, html.lock body { overflow: hidden; }
  .sheet-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 20px 4px;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  .sheet-actions { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  .overlay.kb { padding-top: 10px; padding-bottom: 10px; } /* 자판이 열리면 위아래 여백 줄이기 */
  .spacer { flex: 1; }
  .btn {
    height: 48px; padding: 0 20px; border-radius: 14px; background: var(--soft);
    font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn.primary { background: var(--text); color: #fff; }
  .btn.ghost { background: none; padding: 0 10px; color: var(--sub); font-weight: 600; }
  .btn.danger { color: var(--sun); }

  /* 백업 알림 */
  .reminder {
    display: flex; align-items: center; margin-top: 6px; border-radius: 14px;
    background: #fdf1f4; color: #a35d70;
  }
  .reminder-main { flex: 1; display: flex; align-items: center; gap: 8px; padding: 11px 4px 11px 14px; text-align: left; font-size: 13px; }
  .reminder-main span { flex: 1; }
  .reminder-main b { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .reminder-x { width: 40px; height: 40px; display: grid; place-items: center; color: #c48a99; }

  /* 설정 시트 */
  .set-card { border-radius: 16px; background: var(--soft); overflow: hidden; }
  .set-info { padding: 14px 16px; font-size: 14px; color: var(--sub); border-bottom: 1px solid #ebe9e5; }
  .set-info b { color: var(--text); margin-left: 4px; }
  .set-info span { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }
  .set-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-align: left; }
  .set-row + .set-row { border-top: 1px solid #ebe9e5; }
  .set-row div { display: flex; flex-direction: column; gap: 2px; }
  .set-row b { font-size: 15px; }
  .set-row span { font-size: 12px; color: var(--muted); }

  /* 토스트 */
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 30;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px);
    padding: 12px 18px; border-radius: 999px; background: var(--text); color: #fff; font-size: 14px;
    transition: opacity .2s, transform .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { color: #F5DC8E; font-weight: 700; }

  /* 접기 */
  .fold-btn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .fold-btn svg { transition: transform .2s; }
  .fold-btn.folded svg { transform: rotate(-90deg); }
  .folded-note { display: block; margin-left: 18px; padding: 2px 0 12px; font-size: 13px; color: var(--muted); text-align: left; }
  .filters.folded .filter-scroll { max-height: 34px; overflow: hidden; }
  .fold-chips {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--soft); color: var(--sub);
  }
  .fold-chips[hidden] { display: none; }
  .fold-chips svg { transition: transform .2s; }
  .filters:not(.folded) .fold-chips svg { transform: rotate(180deg); }

  /* 카테고리 없는 할 일 묶음 */
  .cat.none { padding-top: 6px; }
  .cat.none .todos { margin-left: 0; }

  /* 할 일 추가 버튼 (오른쪽 아래 둥근 버튼) */
  .fab {
    position: fixed; z-index: 8; width: 56px; height: 56px; border-radius: 50%;
    right: max(20px, calc(50% - 240px + 20px)); bottom: calc(24px + env(safe-area-inset-bottom));
    display: grid; place-items: center; background: var(--text); color: #fff;
    box-shadow: 0 8px 20px rgba(30, 30, 34, .25);
  }

  /* 월 달력 아래: 고른 날짜의 할 일 */
  .day-panel { margin-top: 22px; }
  .panel-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 0 4px 2px; }
  .panel-head h2 { margin: 2px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
  .empty-day { padding: 24px 0; text-align: center; font-size: 14px; color: var(--muted); }
  .day-panel { border-top: 1px solid #e9e7e3; padding-top: 18px; }

  /* 반복 할 일 삭제 고르기 */
  .del-desc { margin: -4px 0 14px; font-size: 13px; color: var(--sub); }
  .del-list { display: flex; flex-direction: column; gap: 8px; }
  .del-opt { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; background: var(--soft); text-align: left; }
  .del-opt b { font-size: 15px; }
  .del-opt span { font-size: 12px; color: var(--muted); }
  .del-opt.danger b { color: var(--sun); }
  .label .opt { font-weight: 500; }
  .confirm-desc { font-size: 14px; line-height: 1.55; color: var(--sub); }
  .btn.primary.warn { background: #e06c6c; }

  /* 꾹 눌러서 순서 바꾸기 */
  .todo, .cat-head { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .dragging {
    position: relative; z-index: 5; background: #fff; border-radius: 14px;
    box-shadow: 0 10px 28px rgba(30, 30, 34, .18);
  }
  .todo.dragging { outline: 8px solid #fff; } /* 들어 올린 할 일 둘레에 여백처럼 보이게 */
  .todo.dragging .todo-main { border-bottom-color: transparent; }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; }

  /* 팝업 제목 줄: 오른쪽 위 삭제·닫기 버튼 */
  .sheet-head { display: flex; align-items: center; gap: 2px; margin: -6px -8px 12px 0; }
  .sheet-head h3 { margin: 0 auto 0 0; }
  .head-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--sub); }
  .head-btn.danger { color: var(--sun); }

  /* 상세(메모) 시트 */
  .detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--sub); }
  .tag { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 30%, #fff); }
  .tag i { width: 8px; height: 8px; border-radius: 50%; background: color-mix(in srgb, var(--c) 80%, #555); }
  .tag.plain { background: var(--soft); }
  .detail-title { display: flex; align-items: flex-start; gap: 12px; margin: 14px 0 4px; }
  .detail-title .box { margin-top: -10px; }
  .detail-title h3 { margin: 0; flex: 1; font-size: 20px; line-height: 1.4; word-break: break-word; }
  .detail-title.done h3 { text-decoration: line-through; color: var(--muted); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
  // ============ 상수 ============
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const COLORS = ['#F4A7B9', '#F8C4A0', '#F5DC8E', '#B5D8A6', '#A8D8E0', '#A9BFEA', '#C7B6E8', '#C9C4BE'];
  // 이전 버전의 원색 → 파스텔로 변환
  const OLD_TO_PASTEL = {
    '#ff6b6b': '#F4A7B9', '#f06595': '#F4A7B9', '#ff922b': '#F8C4A0', '#fcc419': '#F5DC8E',
    '#51cf66': '#B5D8A6', '#20c997': '#A8D8E0', '#339af0': '#A8D8E0', '#5c7cfa': '#A9BFEA',
    '#9775fa': '#C7B6E8', '#868e96': '#C9C4BE',
  };
  const REPEATS = [['none', '안 함'], ['daily', '매일'], ['weekly', '매주'], ['monthly', '매달'], ['weekdays', '요일 지정']];
  const KEY = 'todolist.v2';

  // 선 아이콘 (설치 없이 SVG로 직접 그림)
  const PATHS = {
    calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    left: '<path d="M15 5l-7 7 7 7"/>',
    right: '<path d="M9 5l7 7-7 7"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    memo: '<rect x="4.5" y="3.5" width="15" height="17" rx="3"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/>',
    repeat: '<path d="M17 3l3 3-3 3"/><path d="M4 12v-1a5 5 0 0 1 5-5h11"/><path d="M7 21l-3-3 3-3"/><path d="M20 12v1a5 5 0 0 1-5 5H4"/>',
    pencil: '<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 7.5l2 2"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M9 7V4.5h6V7M6 7l1 13h10l1-13"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    more: '<path d="M6 12h.01M12 12h.01M18 12h.01"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    upload: '<path d="M12 15V4M7 9l5-5 5 5M5 20h14"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    down: '<path d="M6 9l6 6 6-6"/>',
  };
  const icon = (name, size = 22, sw = 1.7) =>
    `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]}</svg>`;
  const CHECK = icon('check', 12, 3);

  // ============ 날짜 유틸 ============
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const todayKey = () => keyOf(new Date());
  const md = k => { const d = parse(k); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
  const monthOf = k => { const d = parse(k); return new Date(d.getFullYear(), d.getMonth(), 1); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ============ 상태 ============
  let data = load();            // { categories: [{id,name,color}], todos: [{id,text,catId,date,repeat,days,done,memo}] }
  let view = 'day';             // 첫 화면: 주 달력 + 할 일
  let selected = todayKey();
  let cursor = monthOf(selected);
  let sheet = null;
  let filter = 'all';           // 'all' 또는 카테고리 id

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.categories)) {
        s.categories.forEach(c => { c.color = OLD_TO_PASTEL[c.color.toLowerCase()] || c.color; });
        s.todos.forEach(t => { t.memo = t.memo || ''; t.done = t.done || {}; });
        return s;
      }
    } catch {}
    const cats = [
      { id: uid(), name: '일반', color: '#A9BFEA' },
      { id: uid(), name: '운동', color: '#F4A7B9' },
      { id: uid(), name: '공부', color: '#B5D8A6' },
    ];
    let todos = [];
    try { // 첫 버전 데이터가 있으면 옮겨 옴
      const t = todayKey();
      todos = (JSON.parse(localStorage.getItem('todolist.v1')) || []).map(o => ({
        id: o.id || uid(), text: o.text, catId: cats[0].id, date: t, memo: '',
        repeat: o.repeat || 'none', days: o.days || [], done: o.doneKey ? { [t]: true } : {},
      }));
    } catch {}
    return { categories: cats, todos };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} }

  // ============ 백업 ============
  const LB = 'todolist.lastBackup', SINCE = 'todolist.since', SNOOZE = 'todolist.snoozeUntil';
  const DAY = 24 * 60 * 60 * 1000;
  const getLS = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const setLS = (k, v) => { try { localStorage.setItem(k, String(v)); } catch {} };
  if (!getLS(SINCE)) setLS(SINCE, Date.now());
  // 저장 공간이 부족해도 이 데이터는 지우지 말라고 브라우저에 요청
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

  function lastBackupText() {
    const last = Number(getLS(LB));
    if (!last) return '아직 없음';
    const days = Math.floor((Date.now() - last) / DAY);
    const d = new Date(last);
    return `${days === 0 ? '오늘' : `${days}일 전`} (${d.getMonth() + 1}월 ${d.getDate()}일)`;
  }
  function backupReminder() {
    if (!data.todos.length) return '';
    const last = Number(getLS(LB));
    const base = last || Number(getLS(SINCE)) || Date.now();
    if (Date.now() - base < 7 * DAY || Date.now() < (Number(getLS(SNOOZE)) || 0)) return '';
    return last ? `백업한 지 ${Math.floor((Date.now() - last) / DAY)}일 지났어요` : '아직 백업을 한 번도 안 했어요';
  }

  function exportBackup() {
    const now = new Date();
    const name = `todolist-backup-${keyOf(now)}.json`;
    const json = JSON.stringify({ app: 'TodoList', version: 2, exportedAt: now.toISOString(), data }, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const done = () => { setLS(LB, Date.now()); toast('백업 파일을 만들었어요'); if (sheet && sheet.type === 'settings') renderSheet(); };
    // 아이폰: 공유 창으로 '파일에 저장'이나 카톡으로 보낼 수 있게
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'TodoList 백업' })
          .then(done).catch(e => { if (e.name !== 'AbortError') downloadFile(blob, name, done); });
        return;
      }
    } catch {}
    downloadFile(blob, name, done);
  }
  function downloadFile(blob, name, done) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    done();
  }

  async function importBackup(file) {
    let obj;
    try { obj = JSON.parse(await file.text()); } catch { toast('백업 파일을 읽을 수 없어요'); return; }
    const d = obj && obj.data ? obj.data : obj;
    if (!d || !Array.isArray(d.categories) || !Array.isArray(d.todos)) { toast('TodoList 백업 파일이 아니에요'); return; }
    const when = obj.exportedAt ? new Date(obj.exportedAt) : null;
    const whenText = when ? `${when.getFullYear()}년 ${when.getMonth() + 1}월 ${when.getDate()}일` : '이 파일의';
    askConfirm({
      title: '백업으로 되돌릴까요?',
      desc: `${whenText} 백업으로 바꿔요. 지금 있는 할 일 ${data.todos.length}개가 백업 내용(할 일 ${d.todos.length}개)으로 바뀌어요.`,
      ok: '되돌리기',
      back: sheet,
      onOk: () => {
        const before = JSON.stringify(data);
        d.todos.forEach(t => { t.memo = t.memo || ''; t.done = t.done || {}; t.days = t.days || []; });
        data = d;
        save();
        filter = 'all';
        closeSheet();
        toast('백업을 불러왔어요', before);
      },
    });
  }

  // 브라우저 기본 확인 창(confirm)은 일부 환경에서 아예 안 떠서, 앱 안의 확인 창을 씀
  function askConfirm({ title, desc, ok = '확인', danger = false, back = null, onOk }) {
    openSheet({ type: 'confirm', title, desc, ok, danger, back, onOk }, false);
  }

  // ============ 알림(토스트) + 되돌리기 ============
  let toastTimer = null, undoData = null;
  function toast(msg, undoSnapshot) {
    const el = document.getElementById('toast');
    undoData = undoSnapshot || null;
    el.innerHTML = `<span>${esc(msg)}</span>${undoData ? '<button data-action="undo">되돌리기</button>' : ''}`;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove('show'); undoData = null; }, undoData ? 6000 : 2500);
  }

  // ============ 반복 로직 ============
  function occursOn(t, k) {
    if (k < t.date) return false;
    if (t.until && k > t.until) return false; // 반복 끝나는 날 이후로는 안 나타남
    if (t.skip && t.skip.includes(k)) return false; // '이 날만 삭제'한 날
    const d = parse(k), s = parse(t.date);
    switch (t.repeat) {
      case 'daily': return true;
      case 'weekly': return d.getDay() === s.getDay();
      case 'monthly': {
        const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        return d.getDate() === Math.min(s.getDate(), last); // 31일 → 짧은 달은 말일
      }
      case 'weekdays': return t.days.includes(d.getDay());
      default: return k === t.date;
    }
  }
  const todosOn = k => data.todos.filter(t => occursOn(t, k));
  const isDone = (t, k) => !!t.done[k];
  const findTodo = id => data.todos.find(t => t.id === id);
  const catOf = id => data.categories.find(c => c.id === id) || { id: '', color: '#C9C4BE', name: '' };

  function repeatLabel(t) {
    const base = repeatBase(t);
    if (!base || t.repeat === 'none' || !t.until) return base;
    const u = parse(t.until);
    return `${base} · ${u.getMonth() + 1}월 ${u.getDate()}일까지`;
  }

  function repeatBase(t) {
    const s = parse(t.date);
    switch (t.repeat) {
      case 'daily': return '매일';
      case 'weekly': return `매주 ${DOW[s.getDay()]}요일`;
      case 'monthly': return `매달 ${s.getDate()}일`;
      case 'weekdays': return '매주 ' + [0, 1, 2, 3, 4, 5, 6].filter(d => t.days.includes(d)).map(d => DOW[d]).join('·');
      default: return '';
    }
  }

  // ============ 접기 상태 (이 기기에 기억) ============
  const FOLD = 'todolist.folded', CHIPFOLD = 'todolist.chipsFolded';
  const folded = new Set((() => { try { return JSON.parse(getLS(FOLD)) || []; } catch { return []; } })());
  let chipsFolded = getLS(CHIPFOLD) === '1';

  // ============ 화면: 주 달력 + 할 일 (첫 화면) ============
  function renderDay() {
    const sd = parse(selected);
    const tk = todayKey();
    const weekStart = addDays(selected, -sd.getDay());

    const week = [0, 1, 2, 3, 4, 5, 6].map(i => {
      const k = addDays(weekStart, i);
      const list = todosOn(k);
      const left = list.filter(t => !isDone(t, k)).length;
      const st = !list.length ? '' : left ? 'left' : 'all';
      const cls = ['wd', k === tk && 'today', k === selected && 'selected', i === 0 && 'sun', i === 6 && 'sat'].filter(Boolean).join(' ');
      return `<button class="${cls}" data-action="selectDay" data-date="${k}">
        <span class="w">${DOW[i]}</span><span class="n">${parse(k).getDate()}</span><span class="st ${st}"></span></button>`;
    }).join('');

    // 선택한 카테고리만 보여 주기
    if (filter !== 'all' && !data.categories.some(c => c.id === filter)) filter = 'all';
    const visibleCats = filter === 'all' ? data.categories : data.categories.filter(c => c.id === filter);
    const items = filter === 'all' ? todosOn(selected) : todosOn(selected).filter(t => t.catId === filter);
    const doneCount = items.filter(t => isDone(t, selected)).length;
    const pct = items.length ? Math.round(doneCount / items.length * 100) : 0;

    // 접혀 있을 때 선택한 카테고리가 가려지지 않도록 앞으로
    const chipCats = chipsFolded && filter !== 'all'
      ? [...visibleCats, ...data.categories.filter(c => c.id !== filter)] : data.categories;
    const filters = `
      <div class="filters${chipsFolded ? ' folded' : ''}">
        <div class="filter-scroll">
          <button class="fchip${filter === 'all' ? ' on' : ''}" data-action="filter" data-id="all">전체</button>
          ${chipCats.map(c => `<button class="fchip${filter === c.id ? ' on' : ''}" style="--c:${c.color}" data-action="filter" data-id="${c.id}"><i></i>${esc(c.name)}</button>`).join('')}
        </div>
        <button class="fold-chips" data-action="foldChips" hidden aria-label="카테고리 목록 접기·펼치기">${icon('down', 18, 2)}</button>
        <button class="fadd" data-action="addCat" aria-label="카테고리 추가">${icon('plus', 18, 2)}</button>
      </div>`;

    const sections = renderSections(selected, visibleCats, { withNone: filter === 'all' });

    const isToday = selected === tk;
    const reminder = backupReminder();
    return `
      <div class="bar">
        <span class="brand">TodoList</span>
        <div class="actions">
          ${isToday ? '' : `<button class="pill" data-action="selectDay" data-date="${tk}">오늘</button>`}
          <button class="icon-btn" data-action="openMonth" aria-label="월 달력 보기">${icon('calendar')}</button>
          <button class="icon-btn" data-action="openSettings" aria-label="설정·백업">${icon('gear', 21)}</button>
        </div>
      </div>
      ${reminder ? `<div class="reminder">
        <button class="reminder-main" data-action="openSettings">${icon('download', 16, 2)}<span>${reminder}</span><b>백업하기</b></button>
        <button class="reminder-x" data-action="snoozeBackup" aria-label="나중에">${icon('close', 14, 2)}</button>
      </div>` : ''}
      <div class="date-head">
        <div class="eyebrow">${isToday ? '오늘' : `${sd.getFullYear()}년`}</div>
        <h1>${sd.getMonth() + 1}월 ${sd.getDate()}일 ${DOW[sd.getDay()]}요일</h1>
      </div>
      <div class="week" data-swipe="week">
        <button class="icon-btn" data-action="moveWeek" data-n="-7" aria-label="이전 주">${icon('left', 18)}</button>
        <div class="week-days">${week}</div>
        <button class="icon-btn" data-action="moveWeek" data-n="7" aria-label="다음 주">${icon('right', 18)}</button>
      </div>
      ${filters}
      <div class="fade">
        ${items.length ? `<div class="progress"><span>${doneCount}/${items.length}</span><div class="track"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>` : ''}
        ${sections || '<div class="empty-all">아래 + 버튼으로 할 일을 추가해 보세요</div>'}
      </div>
      <button class="fab" data-action="addTodo" data-id="${filter === 'all' ? '' : filter}" aria-label="할 일 추가">${icon('plus', 26, 2.2)}</button>`;
  }

  // ============ 카테고리별 할 일 묶음 (첫 화면·월 달력 공용) ============
  const NONE_COLOR = '#C9C4BE';
  function todoRow(t, k) {
    const done = isDone(t, k);
    const rep = repeatLabel(t);
    const memo = (t.memo || '').trim().split('\n')[0];
    const meta = (rep ? `<span>${icon('repeat', 12, 2)}${rep}</span>` : '')
      + (memo ? `<span class="memo-prev">${icon('memo', 12, 2)}<em>${esc(memo)}</em></span>` : '');
    return `<li class="todo${done ? ' done' : ''}" data-id="${t.id}">
      <button class="box" data-action="toggle" data-id="${t.id}" aria-label="완료 표시"><span>${done ? CHECK : ''}</span></button>
      <button class="todo-main" data-action="openDetail" data-id="${t.id}">
        <div class="t">${esc(t.text)}</div>${meta ? `<div class="meta">${meta}</div>` : ''}
      </button>
    </li>`;
  }
  function section({ id, name, color, list, k, none }) {
    // 카테고리 없는 할 일: 제목 없이 할 일만 맨 위에
    if (none) return `<section class="cat none" style="--c:${color}"><ul class="todos">${list.map(t => todoRow(t, k)).join('')}</ul></section>`;
    const foldKey = id;
    const isFolded = folded.has(foldKey) && list.length > 0;
    const doneIn = list.filter(t => isDone(t, k)).length;
    return `<section class="cat${none ? ' none' : ''}" style="--c:${color}"${none ? '' : ` data-cat="${id}"`}>
      <div class="cat-head">
        ${none ? `<span class="cat-name"><i></i>${name}</span>`
          : `<button class="cat-name" data-action="editCat" data-id="${id}"><i></i>${esc(name)}</button>`}
        <span class="cat-count">${list.length ? `${doneIn}/${list.length}` : ''}</span>
        ${list.length ? `<button class="fold-btn${isFolded ? ' folded' : ''}" data-action="fold" data-id="${foldKey}" aria-label="${isFolded ? '펼치기' : '접기'}">${icon('down', 18, 2)}</button>` : ''}
        ${none ? '' : `<button class="more-btn" data-action="editCat" data-id="${id}" aria-label="${esc(name)} 편집·삭제">${icon('more', 20, 2)}</button>`}
        <button class="add-btn" data-action="addTodo" data-id="${none ? '' : id}" aria-label="할 일 추가">${icon('plus', 14, 2.2)}</button>
      </div>
      ${!list.length ? '<div class="empty-cat">할 일이 없어요</div>'
        : isFolded ? `<button class="folded-note" data-action="fold" data-id="${foldKey}">할 일 ${list.length}개 접혀 있어요</button>`
        : `<ul class="todos">${list.map(t => todoRow(t, k)).join('')}</ul>`}
    </section>`;
  }
  // withNone: '카테고리 없음' 묶음 포함, onlyFilled: 할 일이 있는 카테고리만
  function renderSections(k, cats, { withNone = true, onlyFilled = false } = {}) {
    const items = todosOn(k);
    const known = new Set(data.categories.map(c => c.id));
    const none = items.filter(t => !t.catId || !known.has(t.catId));
    let html = withNone && none.length
      ? section({ name: '카테고리 없음', color: NONE_COLOR, list: none, k, none: true }) : '';
    html += cats.map(c => ({ c, list: items.filter(t => t.catId === c.id) }))
      .filter(x => !onlyFilled || x.list.length)
      .map(({ c, list }) => section({ id: c.id, name: c.name, color: c.color, list, k })).join('');
    return html;
  }

  // 카테고리 버튼 줄이 두 줄 이상일 때만 접기 버튼 보이기
  function updateChipFold() {
    const sc = document.querySelector('.filter-scroll'), btn = document.querySelector('.fold-chips');
    if (!sc || !btn) return;
    btn.hidden = sc.scrollHeight <= 40;
  }

  // ============ 화면: 월 달력 ============
  function renderMonth() {
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const first = new Date(y, m, 1);
    const weeks = Math.ceil((first.getDay() + new Date(y, m + 1, 0).getDate()) / 7);
    const tk = todayKey();

    let cells = '';
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(y, m, 1 - first.getDay() + i);
      const k = keyOf(d);
      const list = todosOn(k);
      const dots = list.slice(0, 6).map(t =>
        `<span class="dot${isDone(t, k) ? ' on' : ''}" style="--c:${catOf(t.catId).color}"></span>`).join('');
      const more = list.length > 6 ? `<span class="more">+${list.length - 6}</span>` : '';
      const cls = ['cell', d.getMonth() !== m && 'other', k === tk && 'today', k === selected && 'selected',
        d.getDay() === 0 && 'sun', d.getDay() === 6 && 'sat'].filter(Boolean).join(' ');
      cells += `<button class="${cls}" data-action="pickDate" data-date="${k}">
        <span class="num">${d.getDate()}</span><span class="dots">${dots}${more}</span></button>`;
    }

    // 이번 달 요약
    let total = 0, done = 0;
    for (let day = 1; day <= new Date(y, m + 1, 0).getDate(); day++) {
      const k = keyOf(new Date(y, m, day));
      todosOn(k).forEach(t => { total++; if (isDone(t, k)) done++; });
    }

    // 고른 날짜의 할 일 (할 일이 있는 카테고리만)
    const sd = parse(selected);
    const dayList = renderSections(selected, data.categories, { onlyFilled: true });

    return `
      <div class="month-bar">
        <button class="icon-btn" data-action="closeMonth" aria-label="돌아가기">${icon('left')}</button>
        <h1>${y}년 ${m + 1}월</h1>
        <button class="pill" data-action="thisMonth">오늘</button>
        <button class="icon-btn" data-action="moveMonth" data-n="-1" aria-label="이전 달">${icon('left', 18)}</button>
        <button class="icon-btn" data-action="moveMonth" data-n="1" aria-label="다음 달">${icon('right', 18)}</button>
      </div>
      <div class="fade">
        <div class="month-card">
        <div class="dow">${DOW.map((n, i) => `<div class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${n}</div>`).join('')}</div>
        <div class="grid" data-swipe="month">${cells}</div>
        </div>
        <div class="month-sum">${total ? `이번 달 할 일 <b>${total}개</b> 중 <b>${done}개</b> 완료` : '날짜를 눌러 그날의 할 일을 확인하세요'}</div>
        <div class="day-panel">
          <div class="panel-head">
            <div>
              <div class="eyebrow">${selected === tk ? '오늘' : `${sd.getFullYear()}년`}</div>
              <h2>${md(selected)} ${DOW[sd.getDay()]}요일</h2>
            </div>
            <button class="pill" data-action="goDay">이 날 보기 ›</button>
          </div>
          ${dayList || '<div class="empty-day">이 날은 할 일이 없어요</div>'}
        </div>
      </div>
      <button class="fab" data-action="addTodo" data-id="" aria-label="할 일 추가">${icon('plus', 26, 2.2)}</button>`;
  }

  function render() {
    document.getElementById('app').innerHTML = view === 'day' ? renderDay() : renderMonth();
    updateChipFold();
  }

  // ============ 바텀 시트 ============
  // 팝업 내용 전체(버튼 포함)를 스크롤 영역 하나에 담음
  function renderSheet() {
    renderSheetContent();
    const el = document.getElementById('sheet');
    const body = document.createElement('div');
    body.className = 'sheet-body';
    [...el.childNodes].forEach(n => body.appendChild(n));
    el.appendChild(body);
  }

  function renderSheetContent() {
    const el = document.getElementById('sheet');
    const s = sheet;

    if (s.type === 'settings') {
      el.innerHTML = `
        <div class="grab"></div>
        <h3>설정</h3>
        <div class="label">백업</div>
        <div class="set-card">
          <div class="set-info">
            <div>마지막 백업 <b>${lastBackupText()}</b></div>
            <span>할 일 ${data.todos.length}개 · 카테고리 ${data.categories.length}개</span>
          </div>
          <button class="set-row" data-action="exportBackup">${icon('download', 20)}
            <div><b>백업 내보내기</b><span>파일로 저장해서 '파일' 앱이나 카톡에 보관하세요</span></div></button>
          <button class="set-row" data-action="importBackup">${icon('upload', 20)}
            <div><b>백업 가져오기</b><span>백업 파일로 할 일을 전부 되돌려요</span></div></button>
        </div>
        <div class="hint">백업 파일은 폰 밖(카톡, 클라우드)에 보관해야 안전해요. 7일 동안 백업하지 않으면 첫 화면에서 알려 드려요.</div>
        <div class="sheet-actions">
          <span class="spacer"></span>
          <button class="btn primary" data-action="closeSheet">닫기</button>
        </div>`;
      return;
    }

    if (s.type === 'todo') {
      const sd = parse(s.date);
      const customUntil = s.until && s.until !== addDays(s.date, 6) && s.until !== addDays(s.date, 29);
      let hint = `${sd.getMonth() + 1}월 ${sd.getDate()}일`;
      if (s.repeat !== 'none') {
        const base = repeatBase({ ...s, days: [...s.days] });
        hint += `부터 ${base || '요일을 선택하세요'}`;
        if (base && s.until) { const u = parse(s.until); hint += ` · ${u.getMonth() + 1}월 ${u.getDate()}일까지`; }
      }
      el.innerHTML = `
        <div class="sheet-head">
          <h3>${s.id ? '할 일' : '새 할 일'}</h3>
          ${s.id ? `<button class="head-btn danger" data-action="deleteTodo" aria-label="삭제">${icon('trash', 20)}</button>` : ''}
          <button class="head-btn" data-action="closeSheet" aria-label="닫기">${icon('close', 20)}</button>
        </div>
        <input type="text" id="sheetText" placeholder="할 일을 입력하세요" value="${esc(s.text)}" autocomplete="off" enterkeyhint="done">
        <div class="label">카테고리 <span class="opt">(선택)</span></div>
        <div class="chips">
          <button class="chip${!s.catId ? ' on' : ''}" data-action="sheetCat" data-id="">없음</button>
          ${data.categories.map(c =>
          `<button class="chip${c.id === s.catId ? ' on' : ''}" style="--c:${c.color}" data-action="sheetCat" data-id="${c.id}"><i></i>${esc(c.name)}</button>`).join('')}</div>
        <div class="label">${s.repeat !== 'none' ? '시작 날짜' : '날짜'}</div>
        <div class="chips">
          <label class="chip date-chip on">
            ${icon('calendar', 15, 2)}<span>${md(s.date)} (${DOW[sd.getDay()]})</span>
            <input type="date" id="dateInput" value="${s.date}">
          </label>
          <button class="chip" data-action="sheetShift" data-n="1">하루 미루기</button>
          <button class="chip" data-action="sheetShift" data-n="7">일주일 미루기</button>
        </div>
        <div class="label">메모</div>
        <textarea id="memo" placeholder="메모를 남겨 보세요 (선택)">${esc(s.memo || '')}</textarea>
        <div class="label">반복</div>
        <div class="chips">${REPEATS.map(([v, n]) =>
          `<button class="chip${v === s.repeat ? ' on' : ''}" data-action="sheetRepeat" data-v="${v}">${n}</button>`).join('')}</div>
        ${s.repeat === 'weekdays' ? `<div class="days">${[0, 1, 2, 3, 4, 5, 6].map(d =>
          `<button class="daybtn${s.days.has(d) ? ' on' : ''}${d === 0 ? ' sun' : d === 6 ? ' sat' : ''}" data-action="sheetDay" data-v="${d}">${DOW[d]}</button>`).join('')}</div>` : ''}
        ${s.repeat !== 'none' ? `
          <div class="label">언제까지</div>
          <div class="chips">
            <button class="chip${!s.until ? ' on' : ''}" data-action="sheetUntil" data-v="">계속</button>
            <button class="chip${s.until === addDays(s.date, 6) ? ' on' : ''}" data-action="sheetUntil" data-v="${addDays(s.date, 6)}">1주</button>
            <button class="chip${s.until === addDays(s.date, 29) ? ' on' : ''}" data-action="sheetUntil" data-v="${addDays(s.date, 29)}">한 달</button>
            <label class="chip date-chip${customUntil ? ' on' : ''}">
              ${icon('calendar', 15, 2)}<span>${customUntil ? `${parse(s.until).getMonth() + 1}월 ${parse(s.until).getDate()}일` : '날짜 고르기'}</span>
              <input type="date" id="untilDate" min="${s.date}" value="${s.until || ''}">
            </label>
          </div>` : ''}
        <div class="hint">${hint}${s.repeat !== 'none' ? ' · 메모는 반복되는 모든 날에 같이 보여요' : ''}</div>
        <div class="sheet-actions">
          <span class="spacer"></span>
          <button class="btn" data-action="closeSheet">취소</button>
          <button class="btn primary" data-action="saveSheet">저장</button>
        </div>`;
      autosize(el.querySelector('#memo'));
      return;
    }

    // 확인 창 (앱 안에서 직접 그림)
    if (s.type === 'confirm') {
      el.innerHTML = `
        <div class="sheet-head"><h3>${esc(s.title)}</h3></div>
        <div class="confirm-desc">${esc(s.desc)}</div>
        <div class="sheet-actions">
          <span class="spacer"></span>
          <button class="btn" data-action="confirmNo">취소</button>
          <button class="btn primary${s.danger ? ' warn' : ''}" data-action="confirmYes">${esc(s.ok)}</button>
        </div>`;
      return;
    }

    // 반복 할 일 삭제 방법 고르기
    if (s.type === 'delRepeat') {
      const t = findTodo(s.id);
      el.innerHTML = `
        <div class="sheet-head">
          <h3>반복 할 일 삭제</h3>
          <button class="head-btn" data-action="delBack" aria-label="닫기">${icon('close', 20)}</button>
        </div>
        <div class="del-desc">${esc(t.text)} · ↻ ${repeatLabel(t)}</div>
        <div class="del-list">
          <button class="del-opt" data-action="delOnly"><b>이 날만 삭제</b><span>${md(s.k)} 하루만 지워요</span></button>
          <button class="del-opt" data-action="delAfter"><b>이 날부터 모두 삭제</b><span>${md(s.k)}부터는 더 이상 나오지 않아요</span></button>
          <button class="del-opt danger" data-action="delAll"><b>전체 삭제</b><span>반복되는 할 일을 한꺼번에 모두 지워요</span></button>
        </div>
        <div class="sheet-actions">
          <span class="spacer"></span>
          <button class="btn" data-action="delBack">취소</button>
        </div>`;
      return;
    }

    // 카테고리
    el.innerHTML = `
      <div class="grab"></div>
      <h3>${s.id ? '카테고리 편집' : '새 카테고리'}</h3>
      <input type="text" id="sheetText" placeholder="예: 운동, 공부, 독서" value="${esc(s.text)}" autocomplete="off" enterkeyhint="done">
      <div class="label">색상</div>
      <div class="swatches">${COLORS.map(c =>
        `<button class="swatch${c === s.color ? ' on' : ''}" style="--c:${c}" data-action="sheetColor" data-v="${c}" aria-label="색상 ${c}"></button>`).join('')}</div>
      <div class="sheet-actions">
        ${s.id ? `<button class="btn ghost danger" data-action="deleteCat">${icon('trash', 18)}삭제</button>` : ''}
        <span class="spacer"></span>
        <button class="btn" data-action="closeSheet">취소</button>
        <button class="btn primary" data-action="saveSheet">저장</button>
      </div>`;
  }

  function autosize(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight + 2, window.innerHeight * 0.45) + 'px';
  }

  // 폰 자판이 올라오면 실제로 보이는 영역에 맞춰 팝업을 자판 위로 올림
  function fitOverlay() {
    const vv = window.visualViewport;
    if (!vv) return;
    const o = document.getElementById('overlay');
    o.style.top = vv.offsetTop + 'px';
    o.style.height = vv.height + 'px';
    o.classList.toggle('kb', window.innerHeight - vv.height > 120); // 자판이 열려 있음
  }
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', fitOverlay);
    visualViewport.addEventListener('scroll', fitOverlay);
  }

  function openSheet(s, focus = true) {
    sheet = s;
    document.documentElement.classList.add('lock'); // 뒤 화면이 같이 스크롤되지 않게
    document.getElementById('toast').classList.remove('show'); // 팝업 버튼을 가리지 않게
    renderSheet();
    fitOverlay();
    document.getElementById('overlay').classList.add('show');
    document.querySelector('#sheet .sheet-body').scrollTop = 0;
    const input = document.getElementById('sheetText');
    if (focus && input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
  function closeSheet() {
    sheet = null;
    document.documentElement.classList.remove('lock');
    document.getElementById('overlay').classList.remove('show');
    render(); // 메모 미리보기 등 목록 갱신
  }
  function syncText() {
    const i = document.getElementById('sheetText');
    if (i && sheet) sheet.text = i.value;
    const m = document.getElementById('memo');
    if (m && sheet) sheet.memo = m.value;
  }
  function rerenderSheet() { syncText(); renderSheet(); }

  function todoForm(t) {
    return {
      type: 'todo', id: t.id, text: t.text, memo: t.memo || '', catId: t.catId || null, date: t.date, origDate: t.date, repeat: t.repeat, until: t.until || null,
      days: new Set(t.repeat === 'weekdays' ? t.days : [parse(t.date).getDay()]),
    };
  }

  function saveSheet() {
    syncText();
    const text = sheet.text.trim();
    if (!text) return document.getElementById('sheetText').focus();

    if (sheet.type === 'todo') {
      if (sheet.repeat === 'weekdays' && !sheet.days.size) { toast('반복할 요일을 하나 이상 골라 주세요'); return; }
      const until = sheet.repeat !== 'none' && sheet.until ? sheet.until : null;
      if (until && until < sheet.date) { toast('끝나는 날은 시작하는 날 이후로 골라 주세요'); return; }
      const fields = { text, memo: sheet.memo || '', catId: sheet.catId || null, date: sheet.date, repeat: sheet.repeat, days: sheet.repeat === 'weekdays' ? [...sheet.days] : [], until };
      let moved = '';
      if (sheet.id) {
        const t = findTodo(sheet.id);
        // 한 번만 하는 할 일을 다른 날로 옮기면 완료 표시도 같이 옮김
        if (t.repeat === 'none' && sheet.repeat === 'none' && sheet.date !== sheet.origDate && t.done[sheet.origDate]) {
          delete t.done[sheet.origDate]; t.done[sheet.date] = true;
        }
        Object.assign(t, fields);
        if (sheet.date !== sheet.origDate) moved = `${md(sheet.date)}로 옮겼어요`;
      } else {
        data.todos.push({ id: uid(), done: {}, ...fields });
        if (sheet.date !== selected) moved = `${md(sheet.date)}에 추가했어요`;
      }
      save(); closeSheet();
      if (moved) toast(moved);
      return;
    } else {
      if (sheet.id) Object.assign(data.categories.find(c => c.id === sheet.id), { name: text, color: sheet.color });
      else data.categories.push({ id: uid(), name: text, color: sheet.color });
    }
    save(); closeSheet();
  }

  // ============ 이벤트 ============
  document.addEventListener('click', e => {
    if (e.target.id === 'overlay') return closeSheet();
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const { action, id, date, v, n } = el.dataset;

    switch (action) {
      // 주 달력 + 할 일
      case 'selectDay': selected = date; break;
      case 'moveWeek': selected = addDays(selected, Number(n)); break;
      case 'openMonth': cursor = monthOf(selected); view = 'month'; window.scrollTo(0, 0); break;
      case 'toggle': {
        const t = findTodo(id);
        if (t.done[selected]) delete t.done[selected]; else t.done[selected] = true;
        save(); break;
      }
      case 'filter': filter = id; break;
      case 'openSettings': return openSheet({ type: 'settings' }, false);
      case 'snoozeBackup': setLS(SNOOZE, Date.now() + 3 * DAY); break;
      case 'exportBackup': return exportBackup();
      case 'importBackup': return document.getElementById('importFile').click();
      case 'undo': {
        if (!undoData) return;
        data = JSON.parse(undoData);
        save();
        toast('되돌렸어요');
        break;
      }
      case 'openDetail': return openSheet(todoForm(findTodo(id)), false); // 할 일을 누르면 수정 + 메모 한 번에
      case 'addTodo':
        return openSheet({ type: 'todo', id: null, text: '', memo: '', catId: id || null, date: selected, repeat: 'none', until: null, days: new Set([parse(selected).getDay()]) });
      case 'addCat': return openSheet({ type: 'cat', id: null, text: '', color: COLORS[data.categories.length % COLORS.length] });
      case 'editCat': { const c = catOf(id); return openSheet({ type: 'cat', id: c.id, text: c.name, color: c.color }); }

      // 월 달력
      case 'closeMonth': view = 'day'; break;
      case 'moveMonth': cursor = new Date(cursor.getFullYear(), cursor.getMonth() + Number(n), 1); break;
      case 'thisMonth': selected = todayKey(); cursor = monthOf(selected); break;
      case 'pickDate': selected = date; break; // 월 달력에 머물면서 아래에 그날 할 일 보여 주기
      case 'goDay': view = 'day'; window.scrollTo(0, 0); break;
      case 'fold': folded.has(id) ? folded.delete(id) : folded.add(id); setLS(FOLD, JSON.stringify([...folded])); break;
      case 'foldChips': chipsFolded = !chipsFolded; setLS(CHIPFOLD, chipsFolded ? '1' : '0'); break;

      case 'deleteTodo': {
        const t = findTodo(sheet.id);
        if (t.repeat !== 'none') { // 반복 할 일은 어떻게 지울지 고르기
          syncText();
          return openSheet({ type: 'delRepeat', id: t.id, k: occursOn(t, selected) ? selected : t.date, back: sheet }, false);
        }
        // 한 번만 하는 할 일은 바로 삭제 (아래 알림에서 되돌리기 가능)
        const before = JSON.stringify(data);
        data.todos = data.todos.filter(x => x.id !== t.id);
        save(); closeSheet();
        return toast('할 일을 삭제했어요', before);
      }
      case 'confirmYes': return sheet.onOk();
      case 'confirmNo': return sheet.back ? openSheet(sheet.back, false) : closeSheet();
      case 'delBack': return openSheet(sheet.back, false);
      case 'delOnly': case 'delAfter': case 'delAll': {
        const t = findTodo(sheet.id), k = sheet.k;
        const before = JSON.stringify(data);
        let msg = '반복 할 일을 모두 삭제했어요';
        if (action === 'delOnly') { t.skip = [...(t.skip || []), k]; msg = `${md(k)} 할 일만 삭제했어요`; }
        else if (action === 'delAfter' && k > t.date) { t.until = addDays(k, -1); msg = `${md(k)}부터 삭제했어요`; }
        else data.todos = data.todos.filter(x => x.id !== t.id);
        save(); closeSheet();
        return toast(msg, before);
      }
      case 'sheetShift': {
        syncText();
        sheet.date = addDays(sheet.date, Number(n));
        if (sheet.until && sheet.until < sheet.date) sheet.until = null;
        return renderSheet();
      }

      // 추가/수정 시트
      case 'sheetCat': sheet.catId = id || null; return rerenderSheet();
      case 'sheetRepeat': sheet.repeat = v; return rerenderSheet();
      case 'sheetUntil': sheet.until = v || null; return rerenderSheet();
      case 'sheetDay': { const d = Number(v); sheet.days.has(d) ? sheet.days.delete(d) : sheet.days.add(d); return rerenderSheet(); }
      case 'sheetColor': sheet.color = v; return rerenderSheet();
      case 'saveSheet': return saveSheet();
      case 'closeSheet': return closeSheet();
      case 'deleteCat': {
        syncText();
        const c = catOf(sheet.id);
        const cnt = data.todos.filter(t => t.catId === c.id).length;
        return askConfirm({
          title: `'${c.name}' 카테고리를 삭제할까요?`,
          desc: cnt ? `이 카테고리의 할 일 ${cnt}개도 같이 삭제돼요.` : '이 카테고리에는 할 일이 없어요.',
          ok: '삭제', danger: true, back: sheet,
          onOk: () => {
            const before = JSON.stringify(data);
            data.categories = data.categories.filter(x => x.id !== c.id);
            data.todos = data.todos.filter(t => t.catId !== c.id);
            save(); closeSheet();
            toast(`'${c.name}' 카테고리를 삭제했어요`, before);
          },
        });
      }
      default: return;
    }
    render();
  });

  document.getElementById('importFile').addEventListener('change', e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (f) importBackup(f);
  });

  // 반복 끝나는 날짜 고르기 (PC 브라우저에서도 칩을 누르면 달력이 열리게)
  document.addEventListener('click', e => {
    if (e.target.id === 'untilDate' || e.target.id === 'dateInput') { try { e.target.showPicker(); } catch {} }
  });
  document.addEventListener('change', e => {
    if (!sheet) return;
    if (e.target.id === 'untilDate') { sheet.until = e.target.value || null; rerenderSheet(); }
    if (e.target.id === 'dateInput' && e.target.value) {
      sheet.date = e.target.value;
      if (sheet.until && sheet.until < sheet.date) sheet.until = null;
      rerenderSheet();
    }
  });

  // 메모 칸은 글 길이에 맞춰 늘어남 (저장은 '저장' 버튼으로)
  document.addEventListener('input', e => {
    if (e.target.id === 'memo') autosize(e.target);
  });

  document.addEventListener('keydown', e => {
    if (!sheet) return;
    if (e.key === 'Escape') closeSheet();
    if (e.key === 'Enter' && e.target.id === 'sheetText' && !e.isComposing) { e.preventDefault(); saveSheet(); }
  });

  // ============ 꾹 눌러서 순서 바꾸기 ============
  // 할 일 또는 카테고리 제목을 0.4초 꾹 누르면 들어 올려지고, 위아래로 끌어서 놓으면 순서가 바뀜
  // 손가락(터치)과 마우스를 따로 처리해야 휴대폰 브라우저가 중간에 스크롤로 착각해서 끊지 않음
  let press = null, drag = null, suppressClick = false, lastTouch = 0;

  function dragItemAt(target) {
    if (sheet || drag) return null;
    if (target.closest('.box, .add-btn, .more-btn, .fold-btn')) return null; // 체크박스·버튼은 제외
    return target.closest('.todo') || (target.closest('.cat-head') && target.closest('.cat[data-cat]'));
  }
  function pressStart(item, x, y) {
    cancelPress();
    press = { item, x, y, lastY: y, timer: setTimeout(() => startDrag(press && press.lastY), 400) };
  }
  function pressMove(x, y) {
    if (!press) return;
    press.lastY = y;
    // 누르는 동안 손가락이 움직이면 스크롤하려는 것으로 보고 취소
    if (Math.hypot(x - press.x, y - press.y) > 10) cancelPress();
  }

  // 터치
  document.addEventListener('touchstart', e => {
    lastTouch = Date.now();
    if (e.touches.length > 1) return cancelPress();
    const item = dragItemAt(e.target);
    if (item) pressStart(item, e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    const p = e.touches[0];
    if (drag) { e.preventDefault(); moveDrag(p.clientY); } // 끄는 동안 화면이 스크롤되지 않게
    else pressMove(p.clientX, p.clientY);
  }, { passive: false });
  document.addEventListener('touchend', e => { lastTouch = Date.now(); if (drag) e.preventDefault(); endDrag(); }, { passive: false });
  document.addEventListener('touchcancel', endDrag);

  // 마우스 (터치 직후에 따라오는 가짜 마우스 이벤트는 무시)
  document.addEventListener('mousedown', e => {
    if (e.button !== 0 || Date.now() - lastTouch < 800) return;
    const item = dragItemAt(e.target);
    if (!item) return;
    e.preventDefault(); // 끄는 동안 글자가 선택되지 않게
    pressStart(item, e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', e => {
    if (Date.now() - lastTouch < 800) return;
    if (drag) moveDrag(e.clientY); else pressMove(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', () => { if (Date.now() - lastTouch >= 800) endDrag(); });
  window.addEventListener('blur', endDrag);

  document.addEventListener('contextmenu', e => { if (press || drag) e.preventDefault(); });
  // 꾹 누른 뒤 손을 떼면 생기는 클릭(수정 창 열기)은 무시
  document.addEventListener('click', e => {
    if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; }
  }, true);

  function cancelPress() { if (press) { clearTimeout(press.timer); press = null; } }

  function startDrag(y) {
    if (!press) return;
    const item = press.item;
    press = null;
    const kind = item.classList.contains('todo') ? 'todo' : 'cat';
    const list = item.parentElement;
    if ([...list.children].filter(el => el.matches(kind === 'todo' ? '.todo' : '.cat[data-cat]')).length < 2) return; // 바꿀 게 없음
    drag = { item, list, kind, grab: y - item.getBoundingClientRect().top };
    item.classList.add('dragging');
    document.body.classList.add('is-dragging');
    suppressClick = true;
    try { navigator.vibrate && navigator.vibrate(15); } catch {}
  }

  function moveDrag(y) {
    const { item, list, kind } = drag;
    const sibs = [...list.children].filter(el => el !== item && el.matches(kind === 'todo' ? '.todo' : '.cat[data-cat]'));
    const before = sibs.find(el => { const r = el.getBoundingClientRect(); return y < r.top + r.height / 2; });
    if (before) { if (item.nextElementSibling !== before) list.insertBefore(item, before); }
    else if (sibs.length && sibs[sibs.length - 1].nextElementSibling !== item) sibs[sibs.length - 1].after(item);
    item.style.transform = '';
    const top = item.getBoundingClientRect().top;
    item.style.transform = `translateY(${y - drag.grab - top}px)`;
    if (y < 80) window.scrollBy(0, -8); else if (y > innerHeight - 80) window.scrollBy(0, 8);
  }

  function endDrag() {
    cancelPress();
    if (!drag) return;
    const { item, list, kind } = drag;
    drag = null;
    item.classList.remove('dragging');
    item.style.transform = '';
    document.body.classList.remove('is-dragging');
    if (kind === 'todo') reorder(data.todos, [...list.querySelectorAll('.todo')].map(el => el.dataset.id));
    else reorder(data.categories, [...list.children].filter(el => el.matches('.cat[data-cat]')).map(el => el.dataset.cat));
    save();
    render();
    setTimeout(() => { suppressClick = false; }, 400);
  }

  // 화면에 보이는 항목들(ids)의 새 순서를, 전체 목록에서 그 항목들이 있던 자리에 그대로 채워 넣음
  function reorder(arr, ids) {
    const objs = ids.map(id => arr.find(x => x.id === id)).filter(Boolean);
    const slots = objs.map(o => arr.indexOf(o)).sort((a, b) => a - b);
    slots.forEach((slot, i) => { arr[slot] = objs[i]; });
  }

  // 좌우로 밀어서 주/달 넘기기
  let touchX = null, touchY = null, swipeEl = null;
  document.addEventListener('touchstart', e => {
    swipeEl = e.target.closest('[data-swipe]');
    if (!swipeEl) return;
    touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!swipeEl || touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
    const kind = swipeEl.dataset.swipe;
    touchX = null; swipeEl = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    const dir = dx < 0 ? 1 : -1;
    if (kind === 'week') selected = addDays(selected, dir * 7);
    else cursor = new Date(cursor.getFullYear(), cursor.getMonth() + dir, 1);
    render();
  });

  // 자정이 지나면 '오늘' 표시 갱신
  let lastDay = todayKey();
  setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); if (!sheet) render(); } }, 60 * 1000);

  render();
</script>
</body>
</html>
